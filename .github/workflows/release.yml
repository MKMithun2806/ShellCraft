name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g., v1.0.1). Creates a real GitHub Release."
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RAW_VERSION=${GITHUB_REF#refs/tags/}
          elif [[ -n "${{ inputs.tag_name }}" ]]; then
            RAW_VERSION=${{ inputs.tag_name }}
          else
            RAW_VERSION=$(git rev-parse --short HEAD)
          fi
          # Strip leading 'v' so main.Version stores e.g. "1.0.0"
          # (the banner format string adds the "v" prefix itself)
          VERSION="${RAW_VERSION#v}"
          BINARY_NAME=shellcraft-${{ matrix.goos }}-${{ matrix.goarch }}
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BINARY_NAME=${BINARY_NAME}.exe
          fi
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
          go build -ldflags "-X main.Version=${VERSION}" -o dist/${BINARY_NAME} ./cmd/shellcraft

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shellcraft-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag_name != ''
        with:
          files: dist/*
          tag_name: ${{ inputs.tag_name || github.ref_name }}
